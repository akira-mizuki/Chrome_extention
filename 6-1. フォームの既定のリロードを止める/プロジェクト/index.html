<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>同期された私のToDoリスト</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <header>
    <h1>私のタスク</h1>
  </header>
  <main>
    <form id="task-form">
      <input
        type="text"
        id="task-input"
        placeholder="タスクを追加する..."
        autocomplete="off">
      <button type="submit">追加</button>
    </form>
    <ul id="task-list"></ul>
  </main>
</body>
</html>
